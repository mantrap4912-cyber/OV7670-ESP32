sentence=Hardware-DMA camera driver for a bare OV7670 (no AL422B FIFO) wired directly to an ESP32.
paragraph=Captures the 8-bit parallel DVP pixel stream using the ESP32 I2S0 peripheral in camera mode, so no GPIO bit-banging is involved. Provides SCCB register access, LEDC XCLK generation, known-good register presets for QQVGA through VGA in RGB565/YUV422/grayscale/Bayer, full-frame and low-RAM line-callback capture, image controls, and examples from a chip-ID sanity check up to a WiFi MJPEG stream server.
category=Device Control
